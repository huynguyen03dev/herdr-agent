id = "local.attention-broker"
name = "Attention Broker"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Wake a room Root once when another Herdr agent needs attention."
platforms = ["linux"]

[[actions]]
id = "status"
title = "Show pending attention events"
contexts = ["global"]
command = ["node", "attention-broker.js", "status"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "attention-broker.js", "event"]

# Crash backstop. A seat that dies or is closed without ever reaching
# `done`/`blocked` emits no status change, so these are the only events that can
# report it. Without them a crashed co-worker never wakes the root at all.
[[events]]
on = "pane.exited"
command = ["node", "attention-broker.js", "event"]

[[events]]
on = "pane.closed"
command = ["node", "attention-broker.js", "event"]
